<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 · 한옥반점</title>
<!-- GitHub Pages 가 없는 주소에 보여 주는 장.
     2026-10-03: 예약 관리 시스템 주소가 /system/ → /manage/ 로 바뀌어서, 옛 주소(/system/…)로 들어오면
     뒤 경로·?·# 를 그대로 둔 채 /manage/… 로 넘깁니다(태블릿 즐겨찾기·홈 화면 바로가기 보호). -->
<script>
(function(){
  var p = location.pathname;
  if(p === "/system" || p.indexOf("/system/") === 0){
    location.replace("/manage" + p.slice(7) + location.search + location.hash);
  }
})();
</script>
<style>
body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif; background:#16120f; color:#efe7d8; text-align:center}
a{color:#d9b46a}
</style>
</head>
<body>
<div><p>찾으시는 페이지가 없습니다.</p><p><a href="/">한옥반점 홈으로</a></p></div>
</body>
</html>
