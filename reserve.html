<!-- 09-29 재아: 네이버 지도·인스타그램에 거는 '바로 예약' 주소(hanokbanjeom.com/reserve).
     홈페이지를 거치지 않고 들어오자마자 예약 창이 열리고, 창을 닫으면 이 장(가게 이름·다시 예약·전화·홈페이지)이 남습니다.
     예약 창 자체는 홈페이지와 같은 js/reserve.js — 고치면 둘 다 바뀝니다 -->
<link rel="stylesheet" href="css/site.css">
<style>
  /* 이 장에만 쓰는 모양 — 사진 한 장 위에 가운데 카드 */
  .rz{min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
      background:linear-gradient(rgba(14,13,12,.72), rgba(14,13,12,.86)), url(img/room-chosun-juyu-gongmyeong.webp) center/cover no-repeat, var(--bg)}
  .rz-in{width:100%; max-width:420px; text-align:center}
  .rz-in img{width:72px; height:72px; margin:0 auto 18px; display:block}
  .rz-in h1{font:900 34px/1.2 var(--serif); color:var(--ink); letter-spacing:.08em; margin:0 0 10px}
  .rz-in p{color:var(--text); font-size:15px; line-height:1.6; margin:0 0 28px}
  .rz-in .btn{width:100%; height:58px; font-size:16px}
  .rz-links{display:flex; justify-content:center; gap:20px; margin-top:22px; font-size:14px}
  .rz-links a{color:var(--text); text-decoration:underline; text-underline-offset:4px}
</style>
<script>document.documentElement.className += " pending";</script>
</head>
<body>
<main class="rz">
  <div class="rz-in">
    <img src="img/icon-192.png?v=2" alt="">
    <h1>한옥반점</h1>
    <p>날짜·시간·인원을 고르시면<br>가게에서 확인한 뒤 연락드려 확정합니다.</p>
    <button type="button" class="btn fill" data-reserve>예약하기</button>
    <div class="rz-links"><a id="rz-tel" href="tel:031-724-1004">전화 문의</a><a href="index.html">홈페이지</a></div>
  </div>
</main>
<script src="data/site.js"></script>
<script src="js/config.js"></script>
<script src="js/hit.js"></script>
<script src="js/content.js"></script>
<script src="js/reserve.js"></script>
<script>
  /* 내용(영업시간·전화·온라인 예약 규칙)이 정해지면 전화번호를 맞추고 예약 창을 바로 엽니다 */
  (window.SITE_READY || Promise.resolve()).then(function(){
    var t = document.getElementById("rz-tel");
    if(window.INFO && INFO.tel){ t.href = "tel:" + INFO.tel; }
    if(window.openReserve) openReserve();
  });
</script>
</body>
</html>
